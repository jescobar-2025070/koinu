<div class="view-table">
  <div class="section-title">ÚLTIMOS GASTOS</div>
  <div class="table-wrap scroll-y">
    <table>
      <thead>
        <tr>
          <th><span class="th-pill">FECHA</span></th>
          <th><span class="th-pill">CATEGORÍA</span></th>
          <th><span class="th-pill">DESCRIPCIÓN</span></th>
          <th><span class="th-pill">MONTO</span></th>
        </tr>
      </thead>
      <tbody>
        @for (movement of movements; track movement.id) {
          <tr>
            <td>{{ formatDate(movement.date) }}</td>
            <td>{{ getCategoryName(movement.expenseCategoryId) }}</td>
            <td class="wrap">{{ movement.description ?? '—' }}</td>
            <td class="right">{{ formatCurrency(movement.amount) }}</td>
          </tr>
        } @empty {
          <tr>
            <td colspan="4" class="table-empty">No hay gastos registrados</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
