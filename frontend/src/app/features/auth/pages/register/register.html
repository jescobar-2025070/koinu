<div id="login-view">
  <form class="login-card" [formGroup]="form" (ngSubmit)="submit()">
    <h1>CREAR CUENTA</h1>

    @if (errorMessage) {
      <div class="alert alert--error">
        <span class="material-symbols-outlined alert__icon">error</span>
        <span>{{ errorMessage }}</span>
      </div>
    }

    <div class="field">
      <label for="email">Correo Electrónico</label>
      <input class="pill-input" id="email" type="email" formControlName="email" autocomplete="email" placeholder="tu@correo.com">
    </div>

    <div class="field">
      <label for="password">Contraseña</label>
      <input class="pill-input" id="password" [type]="showPassword ? 'text' : 'password'" formControlName="password" autocomplete="new-password" placeholder="Mínimo 8 caracteres">
    </div>

    <div class="field">
      <label for="confirmPassword">Confirmar Contraseña</label>
      <input class="pill-input" id="confirmPassword" [type]="showPassword ? 'text' : 'password'" formControlName="confirmPassword" autocomplete="new-password" placeholder="Repita la contraseña">
    </div>

    <div class="signup-row">
      ¿Ya tiene una cuenta? <br>
      <a class="link" routerLink="/login">Iniciar sesión</a>
    </div>

    <button type="submit" class="btn-primary" [disabled]="submitting">
      {{ submitting ? 'Creando cuenta…' : 'Crear Cuenta' }}
    </button>

    <div class="divider" role="separator"><span>o</span></div>

    <button type="button" class="btn-google" [disabled]="googleLoading" (click)="continueWithGoogle()">
      <svg class="google-icon" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.56 2.68-3.87 2.68-6.62Z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.98v2.33A9 9 0 0 0 9 18Z"/>
        <path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.66 9c0-.59.1-1.17.29-1.7V4.97H.98A9 9 0 0 0 0 9c0 1.45.35 2.83.98 4.03l2.97-2.33Z"/>
        <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58C13.46.9 11.43 0 9 0A9 9 0 0 0 .98 4.97l2.97 2.33C4.66 5.17 6.65 3.58 9 3.58Z"/>
      </svg>
      {{ googleLoading ? 'Conectando…' : 'Registrarse con Google' }}
    </button>
  </form>

  <div class="login-art" aria-hidden="true">
    <svg viewBox="0 0 320 420" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
      <defs>
        <radialGradient id="sphereDark" cx="35%" cy="30%" r="70%">
          <stop offset="0%" stop-color="#3a4a5c"/><stop offset="100%" stop-color="#0c1520"/>
        </radialGradient>
        <radialGradient id="sphereBlue" cx="35%" cy="30%" r="70%">
          <stop offset="0%" stop-color="#bfe3ff"/><stop offset="100%" stop-color="#2f6fd6"/>
        </radialGradient>
        <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#3a5570"/><stop offset="100%" stop-color="#0c1a28"/>
        </linearGradient>
        <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#16283d"/><stop offset="100%" stop-color="#0a141f"/>
        </linearGradient>
      </defs>
      <circle cx="270" cy="40" r="16" fill="url(#sphereDark)"/>
      <circle cx="30" cy="130" r="26" fill="url(#sphereDark)"/>
      <circle cx="300" cy="150" r="14" fill="url(#sphereBlue)"/>
      <circle cx="255" cy="300" r="12" fill="url(#sphereDark)"/>
      <circle cx="20" cy="330" r="10" fill="url(#sphereBlue)"/>
      <path d="M150 30 L210 55 V110 C210 155 180 185 150 200 C120 185 90 155 90 110 V55 Z" fill="url(#shieldGrad)" stroke="rgba(255,255,255,0.15)"/>
      <path d="M122 108 L142 128 L182 85" fill="none" stroke="#00e5ff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <g transform="translate(210,90) rotate(35)">
        <circle cx="0" cy="0" r="26" fill="none" stroke="#8fd8d0" stroke-width="12"/>
        <rect x="18" y="-6" width="70" height="12" rx="4" fill="#8fd8d0"/>
        <rect x="70" y="6" width="10" height="16" fill="#8fd8d0"/>
        <rect x="86" y="6" width="10" height="22" fill="#8fd8d0"/>
      </g>
      <rect x="70" y="230" width="190" height="110" rx="18" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.15)"/>
      <rect x="70" y="255" width="190" height="16" fill="#2f6fd6" opacity="0.7"/>
      <rect x="90" y="300" width="26" height="20" rx="4" fill="#7fd8ff"/>
      <circle cx="90" cy="380" r="34" fill="none" stroke="#123055" stroke-width="18"/>
      <circle cx="150" cy="390" r="30" fill="none" stroke="#2f6fd6" stroke-width="16" opacity="0.8"/>
    </svg>
  </div>

  <div class="footer-row">
    <div class="copyright">© 2026 Koinu Finance. Todos los derechos reservados.</div>
    <div class="legal-pill">
      <span>Privacidad</span>
      <span>Términos</span>
      <span>Ayuda</span>
      <span>Contacto</span>
    </div>
  </div>
</div>
