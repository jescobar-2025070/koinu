<div class="view-table">
  <div class="section-title">HISTORIAL DE PERÍODOS</div>
  <div class="table-wrap scroll-y">
    <table>
      <thead>
        <tr>
          <th><span class="th-pill">PERÍODO</span></th>
          <th><span class="th-pill">RANGO</span></th>
          <th><span class="th-pill">ESTADO</span></th>
          <th><span class="th-pill">INGRESOS</span></th>
          <th><span class="th-pill">GASTOS</span></th>
        </tr>
      </thead>
      <tbody>
        @for (period of periods; track period.id) {
          <tr>
            <td>{{ period.name }}</td>
            <td>{{ period.range }}</td>
            <td>{{ period.statusLabel }}</td>
            <td class="right text-green">{{ formatCurrency(period.totalIngresos) }}</td>
            <td class="right text-red">{{ formatCurrency(period.totalGastos) }}</td>
          </tr>
        } @empty {
          <tr>
            <td colspan="5" class="table-empty">No hay períodos en el historial</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
