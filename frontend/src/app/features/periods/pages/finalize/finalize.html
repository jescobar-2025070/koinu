<div class="view-form">
  <div class="section-title">FINALIZAR PERÍODO ACTUAL</div>
  @if (finalized) {
    <div class="finalize-done">
      <div class="finalize-done-icon">✓</div>
      <div class="finalize-done-title">{{ finalizedName }} fue finalizado</div>
      <div class="finalize-done-hint">El informe final quedó guardado y disponible en Reportes para este período.</div>
      <div class="finalize-actions">
        <button class="btn-primary" style="width:auto; padding:12px 22px;" (click)="goNewPeriod()">
          Crear nuevo período
        </button>
        <button class="btn-secondary" (click)="goHistory()">Ver historial de períodos</button>
      </div>
    </div>
  } @else if (currentPeriod) {
    <div class="form-grid">
      <div class="form-field">
        <label>PERÍODO</label>
        <input type="text" class="glow-pill" [value]="periodName" readonly>
      </div>
      <div class="form-field">
        <label>RANGO</label>
        <input type="text" class="glow-pill" [value]="periodRange" readonly>
      </div>
      <div class="form-field">
        <label>INGRESOS TOTALES</label>
        <input type="text" class="glow-pill" [value]="formatCurrency(totalIngresos)" readonly>
      </div>
      <div class="form-field">
        <label>GASTOS TOTALES</label>
        <input type="text" class="glow-pill" [value]="formatCurrency(totalGastos)" readonly>
      </div>
    </div>
    <div class="form-highlight">
      <button class="btn-primary" style="max-width:260px;" (click)="finalizePeriod()" [disabled]="finalizing">Finalizar Período</button>
      <div class="save-msg">{{ saveMessage }}</div>
    </div>
  } @else {
    <div style="text-align:center; color:rgba(255,255,255,0.5); padding:40px;">No hay período abierto para finalizar</div>
  }
</div>
