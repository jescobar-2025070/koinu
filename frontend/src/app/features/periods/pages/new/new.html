<div class="view-form">
  <div class="section-title">NUEVO PERÍODO</div>
  <div class="form-grid">
    <div class="form-field">
      <label>NOMBRE</label>
      <input type="text" class="glow-pill" [(ngModel)]="name" placeholder="Ej. Agosto 2026">
    </div>
    <div class="form-field">
      <label>FECHA INICIO</label>
      <input type="date" class="glow-pill" [(ngModel)]="startDate">
    </div>
    <div class="form-field">
      <label>FECHA FIN</label>
      <input type="date" class="glow-pill" [(ngModel)]="endDate">
    </div>
  </div>
  <div class="form-highlight">
    <button class="btn-primary" (click)="createPeriod()" [disabled]="saving">Crear Período</button>
    <div class="save-msg">{{ saveMessage }}</div>
  </div>
</div>
